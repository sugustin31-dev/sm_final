<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comentarios - Workshop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
  <main class="container">
    <h1>Deja tu comentario</h1>

    <form id="comment-form">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" maxlength="60" required>
      </div>
      <div class="form-group">
        <label for="message">Mensaje</label>
        <textarea id="message" name="message" maxlength="500" rows="4" required></textarea>
      </div>
      <div class="form-group">
        <label for="rating">Valoración</label>
        <select id="rating" name="rating" required>
          <option value="" disabled selected>Puntuar...</option>
          <option value="1">1 - Muy malo</option>
          <option value="2">2 - Malo</option>
          <option value="3">3 - Regular</option>
          <option value="4">4 - Bueno</option>
          <option value="5">5 - Excelente</option>
        </select>
      </div>
      <button type="submit" id="submit-btn">Enviar</button>
    </form>

    <div id="error-msg" class="error hidden"></div>

    <hr>

    <section id="feed">
      <h2>Comentarios</h2>
      <div id="comments-container"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
